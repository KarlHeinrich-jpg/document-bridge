name: Build release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux x86_64
            asset: DocumentBridge-linux-x86_64.tar.gz
            shell: bash
          - os: windows-latest
            label: Windows x86_64
            asset: DocumentBridge-windows-x86_64.zip
            shell: pwsh
          - os: macos-14
            label: macOS Apple Silicon
            asset: DocumentBridge-macos-arm64.tar.gz
            shell: bash
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build portable folder
        run: pyinstaller --noconfirm --clean DocumentBridge.spec
      - name: Smoke test executable (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./dist/DocumentBridge/DocumentBridge --version
      - name: Smoke test executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& .\dist\DocumentBridge\DocumentBridge.exe --version'
      - name: Pack Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C dist -czf "${{ matrix.asset }}" DocumentBridge
      - name: Pack Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/DocumentBridge -DestinationPath "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          artifacts/*
          --repo "$GITHUB_REPOSITORY"
          --title "文桥 ${GITHUB_REF_NAME#v}"
          --generate-notes
